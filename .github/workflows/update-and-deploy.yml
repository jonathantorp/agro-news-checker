name: Update news and deploy

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: agro-news-update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      new_articles: ${{ steps.collect.outputs.new_articles }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -v

      - name: Collect news
        id: collect
        shell: bash
        run: |
          output="$(python -m src.collector)"
          echo "$output"
          echo "$output" >> "$GITHUB_OUTPUT"

      - name: Commit new articles
        if: steps.collect.outputs.new_articles != '0'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/articles.json
          git commit -m "Update media mentions"
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble dashboard
        shell: bash
        run: |
          mkdir public
          cp index.html .nojekyll public/
          cp -R assets data public/

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: "public"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: update
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
